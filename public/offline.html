<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MegaHub — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0F172A; color: #fff; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;
    }
    .logo {
      height: 64px; width: 64px; border-radius: 16px; background: rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 32px;
    }
    h1 { font-size: 20px; font-weight: 800; }
    p { color: rgba(255,255,255,.6); font-size: 14px; max-width: 300px; }
    .spinner {
      height: 32px; width: 32px; border: 4px solid rgba(255,255,255,.2);
      border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button {
      margin-top: 8px; padding: 10px 20px; border: none; border-radius: 10px;
      background: #2563eb; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="logo">M</div>
  <h1>MegaHub</h1>
  <div class="spinner"></div>
  <p>Você está offline. Reconectando…</p>
  <button onclick="window.location.reload()">Tentar novamente</button>
  <script>
    // Auto-recarrega quando a conexão voltar
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
